[project]
name = "openvistool"
version = "0.1.0"
description = "Tool-augmented visual reasoning data construction and agent framework"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
dependencies = [
    "chardet>=5.0",
    "httpx>=0.28",
    "json-repair>=0.57",
    "litellm>=1.81.5,<2",
    "loguru>=0.7.3",
    "matplotlib>=3.10",
    "numpy>=2.0",
    "oauth-cli-kit>=0.1.3",
    "openai>=2.8",
    "opencv-python-headless>=4.10",
    "pillow>=11.0",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.12,<3",
    "readability-lxml>=0.8.4",
    "rich>=14,<15",
    "scipy>=1.15",
    "tqdm>=4.67",
]

[project.optional-dependencies]
visualize = ["streamlit>=1.45"]
dev = [
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nanobot", "distill"]

[tool.hatch.build]
include = [
    "nanobot/**/*.py",
    "distill/**/*.py",
    "distill/**/*.md",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"distill/run.py" = ["E402"]
"distill/filter/evaluate_instructive_trajectory_ablation.py" = ["E402"]
"distill/filter/filter_difficulty.py" = ["E402"]
"distill/filter/filter_tool_gain_with_prefix.py" = ["E402"]
"nanobot/agent/tools/web.py" = ["N803"]
